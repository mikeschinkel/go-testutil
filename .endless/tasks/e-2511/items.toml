# Plan items for E-2511: a mirror of the database. Do not edit this file;
# copy it, edit the copy, and load it with
#   endless task update E-2511 --items-file <copy>

[[item]]
id = "P1"
kind = "deliverable"
statement = "go-testutil's main has no uncommitted changes outside .endless/ and is pushed to origin"
verify = "git status --porcelain; git status -sb"

[[item]]
id = "P2"
kind = "deliverable"
statement = "Every versioned module in go-testutil requires its sibling go-pkgs modules by published versions and has no replace directive; test/ and examples/ modules may keep a replace pointing at ../"

[[item]]
id = "P3"
kind = "deliverable"
statement = "Build, vet and tests pass with GOWORK=off in every module of go-testutil"

[[item]]
id = "P4"
kind = "deliverable"
statement = "The owner has, for each go-testutil module changed since its last tag, a proposed semver version with the reason for the bump and a draft release description"

[[item]]
id = "P5"
kind = "exclusion"
statement = "Creates and pushes no tags; the owner tags through the Release workflow"

[[item]]
id = "P6"
kind = "deliverable"
statement = "Every go.mod in go-testutil (root, test/, examples/basic_usage) says go 1.27.0 and is tidy under Go 1.27"
verify = "grep '^go ' in each go.mod; go mod tidy -diff is empty in each module"

[[item]]
id = "P7"
kind = "deliverable"
statement = "Both GitHub workflows set up Go 1.27 and no workflow or Makefile mentions GOEXPERIMENT"
verify = "grep GO_VERSION and GOEXPERIMENT across .github/workflows and Makefile"

[[item]]
id = "P8"
kind = "deliverable"
statement = "The Release workflow's commit list excludes commits that touch only .endless/ (the ':(exclude).endless' pathspec), which is what E-2497 asks for"
verify = "grep \"':(exclude).endless'\" .github/workflows/release.yml"

[[item]]
id = "P9"
kind = "deliverable"
statement = "/bin/, where make examples writes binaries, is gitignored and nothing under it is tracked"
verify = "git check-ignore bin/x; git ls-files bin is empty"

[[item]]
id = "P10"
kind = "deliverable"
statement = ".claude/settings.local.json, Claude Code's per-user local settings file, is gitignored"
verify = "git check-ignore .claude/settings.local.json"
