[[item]]
id = "P1"
kind = "deliverable"
statement = "go-testutil's main has no uncommitted changes outside .endless/ and is pushed to origin"
verify = "git status --porcelain; git status -sb"

[[item]]
id = "P2"
kind = "deliverable"
statement = "Every versioned module in go-testutil requires its sibling go-pkgs modules by published versions and has no replace directive; test/ and examples/ modules may keep a replace pointing at ../"

[[item]]
id = "P3"
kind = "deliverable"
statement = "Build, vet and tests pass with GOWORK=off in every module of go-testutil"

[[item]]
id = "P4"
kind = "deliverable"
statement = "The owner has, for each go-testutil module changed since its last tag, a proposed semver version with the reason for the bump and a draft release description"

[[item]]
id = "P5"
kind = "exclusion"
statement = "Creates and pushes no tags; the owner tags through the Release workflow"

[[item]]
id = "P6"
kind = "deliverable"
statement = "Every go.mod in go-testutil (root, test/, examples/basic_usage) says go 1.27.0 and is tidy under Go 1.27"
verify = "grep '^go ' in each go.mod; go mod tidy -diff is empty in each module"
