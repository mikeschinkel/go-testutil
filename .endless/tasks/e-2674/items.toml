[[item]]
id = "P1"
kind = "deliverable"
statement = "*BufferedWriter has Quiet() bool, Verbosity() cliutil.Verbosity, WithQuiet(bool) cliutil.Writer and WithVerbosity(cliutil.Verbosity) cliutil.Writer"
verify = "go build ./... in go-testutil"

[[item]]
id = "P2"
kind = "deliverable"
statement = "WithQuiet and WithVerbosity return a new Writer sharing the receiver's buffers, with one setting changed, the same use level and empty V2/V3/Loud caches, and leave the receiver unchanged"
verify = "tests in test/buffered_writer_test.go"

[[item]]
id = "P3"
kind = "deliverable"
statement = "WithVerbosity accepts 0 to 3, a Writer at 0 records nothing from Printf and still records Errorf, and it panics outside 0 to 3"
verify = "tests in test/buffered_writer_test.go"

[[item]]
id = "P4"
kind = "deliverable"
statement = "BufferedWriter has no SetQuiet or SetVerbosity, and go-testutil's tests and examples use WithQuiet and WithVerbosity"
verify = "grep -rnE 'SetQuiet|SetVerbosity' --include='*.go' . finds nothing; go build ./... in examples/basic_usage"

[[item]]
id = "P5"
kind = "deliverable"
statement = "Every Writer over the same buffers, from V2, V3, Loud, WithQuiet or WithVerbosity, shares one mutex"
verify = "a test writing concurrently through a parent, its V2 and a WithQuiet Writer passes go test -race"

[[item]]
id = "P6"
kind = "deliverable"
statement = "A Writer from Loud() records Printf output regardless of WithQuiet(true), and V2 and V3 of a quiet Writer record nothing"
verify = "tests in test/buffered_writer_test.go"

[[item]]
id = "P7"
kind = "deliverable"
statement = "go test -race ./... passes in test/"
verify = "go test -race ./... in test/"

[[item]]
